name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test:impact:self
      - name: Validate changed test plan
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: pnpm test:impact -- --base "$BASE_SHA" --head "$HEAD_SHA"
      - name: Validate PR commit messages
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: pnpm exec commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose

  unit:
    name: Unit and integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm ci:test
      - name: Upload unit test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-evidence
          path: artifacts/unit
          if-no-files-found: error
          retention-days: 14

  storybook:
    name: Storybook component tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm ci:test:stories
      - run: pnpm build-storybook
      - run: pnpm test:storybook-smoke
      - name: Upload Storybook and browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: storybook-evidence
          path: |
            storybook-static
            artifacts/storybook
            artifacts/storybook-smoke
          if-no-files-found: error
          retention-days: 14

  mutation:
    name: Changed-line mutation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Mutate changed executable lines
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: >-
          pnpm test:mutation:changed --
          --base "$BASE_SHA"
          --head "$HEAD_SHA"
      - name: Publish mutation summary
        if: always()
        run: |
          if test -s artifacts/stryker/incremental/summary.md; then
            cat artifacts/stryker/incremental/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload incremental mutation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: incremental-mutation-evidence
          path: artifacts/stryker/incremental
          if-no-files-found: error
          retention-days: 30

  build:
    name: Production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Upload immutable application artifact
        uses: actions/upload-artifact@v7
        with:
          name: app-dist
          path: dist
          retention-days: 14

  e2e:
    name: Playwright Chromium
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: app-dist
          path: dist
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e:pr
      - name: Upload Playwright diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-pr-report
          path: |
            artifacts/playwright-report
            artifacts/playwright-results
          if-no-files-found: ignore
          retention-days: 14

  quality-gate:
    name: Quality gate
    if: always()
    needs: [static, unit, storybook, mutation, build, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Require every PR gate
        env:
          STATIC_RESULT: ${{ needs.static.result }}
          UNIT_RESULT: ${{ needs.unit.result }}
          STORYBOOK_RESULT: ${{ needs.storybook.result }}
          MUTATION_RESULT: ${{ needs.mutation.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
        run: |
          test "$STATIC_RESULT" = success
          test "$UNIT_RESULT" = success
          test "$STORYBOOK_RESULT" = success
          test "$MUTATION_RESULT" = success
          test "$BUILD_RESULT" = success
          test "$E2E_RESULT" = success
